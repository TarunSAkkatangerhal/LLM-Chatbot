<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sage · Interview Prep Mentor</title>
<style>
  :root{
    --bg:#f6f5f1; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e5e3dc;
    --accent:#2f6f5e; --accent-ink:#ffffff; --user:#2f6f5e; --bot:#eeece5; --err:#b42318; --errbg:#fdecea;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#15171a; --panel:#1d2024; --ink:#e8e8e6; --muted:#9aa0a6; --line:#2d3136;
      --accent:#5fb89f; --accent-ink:#0e1512; --user:#2b5e4f; --bot:#262a2f; --err:#ff8a80; --errbg:#3a1f1d;}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center}
  .app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding:0 16px}
  header{display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
  .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    display:grid;place-items:center;font-weight:700}
  header h1{font-size:17px;margin:0;line-height:1.2}
  header small{color:var(--muted);display:block;font-size:12.5px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer}
  .ghost{background:none;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:8px}
  .ghost:hover{border-color:var(--accent)}
  #log{flex:1;overflow-y:auto;padding:18px 0;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--user);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
  .msg code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:rgba(127,127,127,.18);padding:1px 5px;border-radius:4px}
  .msg pre{margin:8px 0 2px;padding:10px 12px;background:rgba(127,127,127,.15);border-radius:8px;overflow-x:auto;white-space:pre}
  .msg pre code{background:none;padding:0}
  .error{align-self:stretch;background:var(--errbg);color:var(--err);border:1px solid var(--err);border-radius:10px;
    padding:10px 14px;display:flex;gap:12px;align-items:center}
  .error button{margin-left:auto;background:none;border:1px solid var(--err);color:var(--err);border-radius:8px;padding:4px 10px}
  .typing{display:inline-flex;gap:4px;padding:4px 0}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .hints button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
  .hints button:hover{border-color:var(--accent)}
  footer{padding:10px 0 16px}
  form{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
  form:focus-within{border-color:var(--accent)}
  textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;max-height:140px;padding:6px 8px}
  #send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 18px;font-weight:600}
  #send:disabled{opacity:.5;cursor:not-allowed}
  .ctx{color:var(--muted);font-size:12px;text-align:center;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">S</div>
    <div><h1>Sage</h1><small>Interview-prep mentor for CS students</small></div>
    <div class="spacer"></div>
    <button class="ghost" id="reset" title="Start a fresh conversation">New chat</button>
  </header>

  <main id="log" aria-live="polite"></main>

  <footer>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask Sage anything… (Enter to send, Shift+Enter for a new line)" maxlength="4000"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <div class="ctx" id="ctx"></div>
  </footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const log = $("#log"), input = $("#input"), sendBtn = $("#send"), ctx = $("#ctx");
let conversationId = null;  // server keeps history in memory, so a page reload starts a fresh chat
let lastMessage = null;   // for the Retry button
let busy = false;

const GREETING = "Hi, I'm Sage 👋 I help with interview prep: concepts, mock questions, resumes and behavioural answers. What are you preparing for?";
const HINTS = ["Quiz me on SQL joins", "Explain Big-O with an example", "Help me answer 'Tell me about yourself'"];

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(text){
  let h = escapeHtml(text);
  h = h.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>`<pre><code>${c.replace(/\n$/,"")}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  return h;
}
function add(role, text){
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = role === "bot" ? render(text) : escapeHtml(text);
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function showError(message){
  const d = document.createElement("div"); d.className = "error";
  d.innerHTML = `<span>⚠️ ${escapeHtml(message)}</span>`;
  if (lastMessage){
    const b = document.createElement("button"); b.textContent = "Retry";
    b.onclick = () => { d.remove(); send(lastMessage, true); }; d.appendChild(b);
  }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function setBusy(v){ busy = v; sendBtn.disabled = v; }

function showGreeting(){
  log.innerHTML = ""; add("bot", GREETING);
  const h = document.createElement("div"); h.className = "hints";
  HINTS.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); h.appendChild(b); });
  log.appendChild(h);
}

async function send(text, isRetry=false){
  if (busy || !text.trim()) return;
  document.querySelector(".hints")?.remove();
  if (!isRetry) add("user", text);
  lastMessage = text; input.value = ""; autosize(); setBusy(true);

  const typing = add("bot", ""); typing.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);   // client-side safety net

  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"}, signal: controller.signal,
      body: JSON.stringify({conversation_id: conversationId, message: text}),
    });
    const data = await res.json().catch(() => ({}));
    typing.remove();
    if (!res.ok) { showError(data.error || `Server error (${res.status}).`); return; }
    conversationId = data.conversation_id;
    add("bot", data.reply); lastMessage = null;
    const c = data.context;
    ctx.textContent = `Context: ${c.messages_in_context} messages` + (c.has_summary ? " + running summary" : "") + ` · strategy: ${c.strategy}`;
  } catch (err) {
    typing.remove();
    showError(err.name === "AbortError" ? "The request timed out. Please try again."
                                         : "Can't reach the server. Is it still running?");
  } finally { clearTimeout(timer); setBusy(false); input.focus(); }
}

async function resetChat(){
  if (conversationId) fetch(`/api/conversations/${conversationId}`, {method: "DELETE"}).catch(()=>{});
  conversationId = null; lastMessage = null;
  ctx.textContent = ""; showGreeting(); input.focus();
}

function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); } });
$("#form").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
$("#reset").addEventListener("click", resetChat);

showGreeting();
</script>
</body>
</html>
